[build-system]
requires      = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name            = "tomovic"
version         = "0.1.0"
description     = "Visualization console and preprocessing pipeline for SAR tomograms, DEM and acquisition geometry"
readme          = "README.md"
requires-python = ">=3.11"
dependencies    = [
    "numpy==2.4.3",
    "scipy==1.17.1",
    "matplotlib==3.10.8",
    "pillow==12.1.1",
    "h5py==3.16.0",
    "rich==15.0.0",
    "psutil==7.2.2",
    "pynvml==13.0.1",
]

[project.optional-dependencies]
fitting = ["jax>=0.4.30"]
dev     = ["pytest==9.0.3", "pyflakes==3.4.0"]

[tool.setuptools.packages.find]
include = ["configuration*", "pipelines*", "tools*"]

[tool.pytest.ini_options]
testpaths      = ["tests"]
strict_markers = true
markers        = [
    "real_data: test depends on the transferred real SAR data under test_data/",
    "slow: heavier test (full-frame numerics)",
]
